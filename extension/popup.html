<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PineSign</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img src="icons/icon48.png" alt="" class="mark" />
    <div>
      <h1>PineSign</h1>
      <p class="tag">Encrypted here. Proven there.</p>
    </div>
  </header>

  <section class="card">
    <h2>You</h2>

    <div id="no-name">
      <p class="hint">
        Names are claimed in the app, where your wallet is. Open it, sign in, and claim
        one — this extension holds the key it publishes.
      </p>
      <a class="primary" id="open-app" href="#" target="_blank">Open PineSign</a>
      <p class="status" id="name-status"></p>
    </div>

    <div id="have-name" hidden>
      <code class="key" id="your-name">…</code>
      <div class="row">
        <button class="ghost" id="copy-name">Copy name</button>
        <button class="ghost" id="backup">Back up key</button>
      </div>
    </div>
  </section>

  <section class="card" id="send-card" hidden>
    <h2>Send a file</h2>
    <label for="recipient">To</label>
    <input id="recipient" type="text" placeholder="bob.pinesign.eth" spellcheck="false" />
    <p class="resolved" id="resolved"></p>

    <label for="file">File</label>
    <input id="file" type="file" />

    <button class="primary" id="send" disabled>Encrypt and send</button>
    <p class="status" id="status"></p>

    <div class="result" id="result" hidden>
      <p class="hint">Send this link to them. It expires with the file.</p>
      <code class="link" id="claim-link"></code>
      <button class="ghost" id="copy-link">Copy link</button>
    </div>
  </section>

  <footer class="foot">
    <label for="gateway">Gateway</label>
    <input id="gateway" type="text" spellcheck="false" />
    <span class="mode" id="mode"></span>
  </footer>

  <script type="module" src="lib/popup.bundle.js"></script>
</body>
</html>
