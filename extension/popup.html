<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PineSign</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img src="icons/icon48.png" alt="" class="mark" />
    <div>
      <h1>PineSign</h1>
      <p class="tag">Encrypted here. Proven there.</p>
    </div>
  </header>

  <section class="card" id="identity-card">
    <h2>Your key</h2>
    <p class="hint">Share this with anyone who wants to send you a file.</p>
    <code class="key" id="pubkey">…</code>
    <div class="row">
      <button class="ghost" id="copy-key">Copy key</button>
      <span class="addr" id="address"></span>
    </div>
  </section>

  <section class="card">
    <h2>Send a file</h2>
    <label for="recipient">Recipient's key</label>
    <input id="recipient" type="text" placeholder="03a1b2c3… (66 hex characters)" spellcheck="false" />

    <label for="file">File</label>
    <input id="file" type="file" />

    <button class="primary" id="send" disabled>Encrypt and send</button>
    <p class="status" id="status"></p>

    <div class="result" id="result" hidden>
      <p class="hint">Send this link to the recipient. It expires with the file.</p>
      <code class="link" id="claim-link"></code>
      <button class="ghost" id="copy-link">Copy link</button>
    </div>
  </section>

  <footer class="foot">
    <label for="gateway">Gateway</label>
    <input id="gateway" type="text" spellcheck="false" />
    <span class="mode" id="mode"></span>
  </footer>

  <script type="module" src="lib/popup.bundle.js"></script>
</body>
</html>
