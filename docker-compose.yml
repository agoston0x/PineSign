# Bee, in light mode.
#
# A light node does not store or forward other people's chunks, which is all we
# would be paying for — it uploads, it downloads, and it buys postage. It reads
# Gnosis through an RPC endpoint instead of syncing a chain itself, so it is
# ready in minutes rather than hours.

services:
  bee:
    image: ethersphere/bee:2.8.2
    # The image's entrypoint is the bare binary, which prints help and exits
    # without a subcommand.
    command: start
    restart: unless-stopped
    ports:
      # HTTP API, bound to localhost: only the gateway should reach it. On a
      # host with no firewall, publishing it on all interfaces makes the node's
      # wallet and postage controllable by anyone who finds the port.
      - "127.0.0.1:1633:1633"
      # The P2P port must be reachable for the node to join the network. Without
      # it Bee starts, syncs and answers questions, but has no peers to store
      # anything with.
      - "1634:1634"
    volumes:
      - bee-data:/home/bee/.bee
    environment:
      BEE_API_ADDR: ":1633"
      BEE_P2P_ADDR: ":1634"

      # Light mode: participate enough to use the network, not to serve it.
      BEE_FULL_NODE: "false"
      BEE_SWAP_ENABLE: "true"

      # Gnosis, where BZZ and the postage contracts live. Override with your own
      # endpoint if the public one is rate-limiting you.
      BEE_BLOCKCHAIN_RPC_ENDPOINT: "${GNOSIS_RPC:-https://rpc.gnosischain.com}"

      # Unlocks the node's keystore. Change it before anything real, and note
      # the node's wallet is generated on first boot inside the volume.
      BEE_PASSWORD: "${BEE_PASSWORD:-pinesign-dev-password}"

      BEE_VERBOSITY: "info"

      # The gateway talks to this node over the compose network; nothing else
      # should, so CORS stays closed.
      BEE_CORS_ALLOWED_ORIGINS: ""

volumes:
  bee-data:
