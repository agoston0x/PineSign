<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo · PineSign</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="nav" class="scrolled">
  <a class="brand" href="/"><img src="assets/pine.png" alt="" /><span>PineSign</span></a>
  <div class="links"><a href="docs.html">Docs</a><span id="account-slot"></span></div>
</nav>

<main class="page">
  <div class="inner">
    <div class="section-pre">ETHRome 2026</div>
    <h2 class="section-title">Demo</h2>
    <p class="section-sub">Encrypted on your machine, stored on Swarm, attested on ENS.</p>

    <video id="demo" controls playsinline preload="metadata"
      style="width:100%;border-radius:14px;border:1px solid var(--line);background:#000">
      <source src="/demo.mp4" type="video/mp4" />
    </video>
    <p class="hint" id="pending" hidden style="margin-top:12px">
      The video is being uploaded — check back shortly. Meanwhile, the app itself is live
      <a href="/">here</a>.
    </p>
  </div>
</main>

<script>
  // If the file is not there yet, say so rather than show a broken player.
  const v = document.getElementById('demo')
  v.addEventListener('error', () => { v.hidden = true; document.getElementById('pending').hidden = false }, true)
  fetch('/demo.mp4', { method: 'HEAD' }).then((r) => { if (!r.ok) { v.hidden = true; document.getElementById('pending').hidden = false } })
</script>
<script type="module" src="nav.bundle.js"></script>
</body>
</html>
